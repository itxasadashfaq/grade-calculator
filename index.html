<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Grade Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🎓 Student Grade Calculator</h1>
    <div class="input-section">
      <input type="text" id="subjectInput" placeholder="Subject name...">
      <input type="number" id="marksInput" placeholder="Marks (0-100)" min="0" max="100">
      <button id="addBtn">Add Subject</button>
    </div>
    <table id="gradeTable">
      <thead>
        <tr>
          <th>#</th>
          <th>Subject</th>
          <th>Marks</th>
          <th>Grade</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="result" id="result"></div>
    <button id="calculateBtn">📊 Calculate GPA</button>
    <button id="clearBtn">🗑️ Clear All</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
